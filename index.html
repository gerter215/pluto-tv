<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pluto TV</title>
<meta name="theme-color" content="#0b0b12">
<!-- بهینه‌سازی برای مرورگر تلویزیون سامسونگ (Tizen) -->
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%237c3aed'/%3E%3Cellipse cx='32' cy='32' rx='40' ry='10' fill='none' stroke='%23a855f7' stroke-width='4' transform='rotate(-20 32 32)'/%3E%3Ccircle cx='50' cy='22' r='5' fill='%23e879f9'/%3E%3C/svg%3E">
</head>
<body>
  <!-- صفحه بارگذاری -->
  <div id="splash">
    <div class="splash-logo">
      <svg viewBox="0 0 64 64" width="90" height="90" aria-hidden="true">
        <circle cx="32" cy="32" r="26" fill="#7c3aed"/>
        <ellipse cx="32" cy="32" rx="38" ry="9" fill="none" stroke="#a855f7" stroke-width="3.5" transform="rotate(-20 32 32)"/>
        <circle cx="50" cy="21" r="4.5" fill="#e879f9"/>
      </svg>
      <h1>Pluto <span>TV</span></h1>
      <p>در حال آماده‌سازی…</p>
    </div>
  </div>

  <!-- بدنه اپ -->
  <div id="app" class="hidden">
    <!-- نوار کناری -->
    <nav id="sidebar" aria-label="منوی اصلی">
      <div class="brand">
        <svg viewBox="0 0 64 64" width="34" height="34" aria-hidden="true">
          <circle cx="32" cy="32" r="26" fill="#7c3aed"/>
          <ellipse cx="32" cy="32" rx="38" ry="9" fill="none" stroke="#a855f7" stroke-width="3.5" transform="rotate(-20 32 32)"/>
          <circle cx="50" cy="21" r="4.5" fill="#e879f9"/>
        </svg>
        <span class="brand-name">Pluto TV</span>
      </div>
      <div id="nav-items"></div>
      <div class="sidebar-footer">
        <div class="hint">▲▼◀▶ حرکت · OK انتخاب · ⏎ بازگشت</div>
      </div>
    </nav>

    <!-- محتوای اصلی -->
    <main id="main"></main>
  </div>

  <!-- پخش‌کننده ویدیو -->
  <div id="player-overlay" class="hidden">
    <video id="video" playsinline></video>
    <div id="player-ui">
      <div id="player-top">
        <div id="player-title"></div>
        <button class="focusable player-btn" id="btn-back-player" data-action="back">بازگشت ⏎</button>
      </div>
      <div id="player-center">
        <button class="focusable player-btn big" id="btn-playpause" data-action="playpause">▶</button>
        <div id="player-msg" class="hidden"></div>
      </div>
      <div id="player-bottom">
        <div id="player-timebar">
          <div id="player-buffer"></div>
          <div id="player-progress"></div>
          <div id="player-handle"></div>
        </div>
        <div id="player-time">00:00 / 00:00</div>
        <div id="player-controls">
          <button class="focusable player-btn sm" id="btn-rewind" data-action="rewind">⏪ ۱۰ث</button>
          <button class="focusable player-btn sm" id="btn-fwd" data-action="fwd">⏩ ۱۰ث</button>
          <button class="focusable player-btn sm" data-action="fullscreen">⛶ تمام‌صفحه</button>
          <button class="focusable player-btn sm" id="btn-quality" data-action="quality">کیفیت</button>
          <button class="focusable player-btn sm" data-action="download">⬇ دانلود</button>
        </div>
      </div>
    </div>
    <div id="quality-menu" class="hidden"></div>
  </div>

  <!-- پیام خطا / اعلان -->
  <div id="toast" class="hidden"></div>

  <!-- اسکریپت‌ها -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/focus.js"></script>
  <script src="js/player.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
